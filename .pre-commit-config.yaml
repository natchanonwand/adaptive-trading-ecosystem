repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
      - id: secret-scan
        name: Secret scan (tracked and nonignored project files)
        entry: uv run --locked python scripts/secret_scan.py
        language: system
        pass_filenames: false
